<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BRS to QA Automation Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F5F7FA; --panel:#FFFFFF; --ink:#172131; --ink-2:#4A5568; --ink-3:#7A8699;
  --line:#DCE2EA; --line-2:#EDF1F6; --side:#13233A; --side-ink:#C9D4E3; --side-active:#22395A;
  --blue:#2463D6; --blue-bg:#E8F0FD; --green:#1B8A57; --green-bg:#E4F5EC;
  --orange:#C77712; --orange-bg:#FDF1DF; --red:#C8372D; --red-bg:#FCE8E6;
  --purple:#7442C8; --purple-bg:#F0E9FB; --gray:#6E7887; --gray-bg:#EEF1F4;
  --code-bg:#0F1B2B; --code-ink:#DCE6F2;
  --font:"IBM Plex Sans Thai","Leelawadee UI","Tahoma",system-ui,sans-serif;
  --mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1622; --panel:#16202E; --ink:#E6ECF4; --ink-2:#B3BFCE; --ink-3:#8795A8;
    --line:#2A3748; --line-2:#1F2B3B; --side:#0A111B; --side-ink:#AEBBCD; --side-active:#1B2A40;
    --blue:#6B9CF0; --blue-bg:#1A2B47; --green:#4CC08A; --green-bg:#16362A;
    --orange:#EAA64A; --orange-bg:#3A2A14; --red:#EE7B72; --red-bg:#3D1C1A;
    --purple:#AE8AF0; --purple-bg:#2A2043; --gray:#9AA5B4; --gray-bg:#242F3E;
  }
}
:root[data-theme="dark"]{
    --bg:#0E1622; --panel:#16202E; --ink:#E6ECF4; --ink-2:#B3BFCE; --ink-3:#8795A8;
    --line:#2A3748; --line-2:#1F2B3B; --side:#0A111B; --side-ink:#AEBBCD; --side-active:#1B2A40;
    --blue:#6B9CF0; --blue-bg:#1A2B47; --green:#4CC08A; --green-bg:#16362A;
    --orange:#EAA64A; --orange-bg:#3A2A14; --red:#EE7B72; --red-bg:#3D1C1A;
    --purple:#AE8AF0; --purple-bg:#2A2043; --gray:#9AA5B4; --gray-bg:#242F3E;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
#root{height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1{font-size:22px;line-height:1.3;margin:0;font-weight:600}
h2{font-size:17px;margin:0 0 10px;font-weight:600}
h3{font-size:15px;margin:0 0 8px;font-weight:600}
p{margin:0 0 8px}
code,.mono{font-family:var(--mono);font-size:12.5px}
.app{display:grid;grid-template-columns:248px 1fr;height:100%}
.side{background:var(--side);color:var(--side-ink);overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand b{display:block;color:#fff;font-size:15px;letter-spacing:.2px}
.brand span{font-size:12px;opacity:.7}
.nav{padding:8px 0 20px}
.nav .grp{font-size:11.5px;opacity:.55;padding:14px 18px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 18px;color:var(--side-ink);text-decoration:none;font-size:13.5px;border-left:3px solid transparent}
.nav a:hover{background:rgba(255,255,255,.04)}
.nav a.on{background:var(--side-active);color:#fff;border-left-color:#5B9BFF}
.nav .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.1);padding:0 7px;border-radius:9px}
.nav .cnt.warn{background:#C77712;color:#fff}.nav .cnt.bad{background:#C8372D;color:#fff}
.main{display:flex;flex-direction:column;min-width:0;height:100%}
.top{display:flex;align-items:center;gap:12px;padding:10px 24px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top .crumb{font-size:13px;color:var(--ink-3);flex:1;min-width:200px}
.top .crumb a{color:var(--ink-2);text-decoration:none}
.top .crumb a:hover{text-decoration:underline}
.top select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);width:auto;max-width:300px}
.userchip{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.content{flex:1;overflow-y:auto;padding:22px 24px 60px}
.pagehead{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.pagehead .sub{color:var(--ink-3);font-size:13.5px;margin-top:2px}
.pagehead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
/* pipeline rail — the signature element */
.rail{display:flex;margin:0 0 18px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.rail a{flex:1;min-width:120px;padding:10px 14px;text-decoration:none;color:var(--ink-2);position:relative;border-right:1px solid var(--line-2)}
.rail a:last-child{border-right:0}
.rail a .n{font-size:20px;font-weight:600;color:var(--ink);display:block;line-height:1.2}
.rail a .l{font-size:12px}
.rail a::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c,var(--gray))}
.rail a:hover{background:var(--line-2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:14px 16px;text-decoration:none;color:inherit;display:block}
.kpi .v{font-size:26px;font-weight:600;line-height:1.2}
.kpi .k{font-size:12.5px;color:var(--ink-3)}
.kpi:hover{border-color:var(--blue)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:7px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13.5px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.ai{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.badge{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:10px;font-weight:500;white-space:nowrap;background:var(--gray-bg);color:var(--gray)}
.b-blue{background:var(--blue-bg);color:var(--blue)}.b-green{background:var(--green-bg);color:var(--green)}
.b-orange{background:var(--orange-bg);color:var(--orange)}.b-red{background:var(--red-bg);color:var(--red)}
.b-purple{background:var(--purple-bg);color:var(--purple)}.b-gray{background:var(--gray-bg);color:var(--gray)}
.label-assume{display:inline-block;font-size:11px;font-weight:600;color:var(--orange);border:1px solid var(--orange);border-radius:4px;padding:0 6px;margin-bottom:4px}
.label-rec{display:inline-block;font-size:11px;font-weight:600;color:var(--purple);border:1px solid var(--purple);border-radius:4px;padding:0 6px;margin-bottom:4px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--ink-2);background:var(--line-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--line-2)}
tr.sel td{background:var(--blue-bg)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12.5px;color:var(--ink-2);font-weight:500}
input[type=text],input[type=password],input[type=number],input[type=url],select,textarea{border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:var(--panel);width:100%}
textarea{resize:vertical;min-height:70px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar input[type=text]{max-width:260px}
.toolbar select{width:auto}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
.split3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.split2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.list{max-height:70vh;overflow-y:auto}
.src{background:var(--line-2);border-left:3px solid var(--blue);padding:10px 12px;border-radius:6px;white-space:pre-wrap;font-size:13.5px}
mark{background:#FFE58F;color:#1a1a1a;border-radius:2px;padding:0 1px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:13.5px}
.kv dt{color:var(--ink-3)}.kv dd{margin:0}
.nf{color:var(--red);font-family:var(--mono);font-size:12px}
.reasons{list-style:none;padding:0;margin:4px 0 0}
.reasons li{padding:2px 0;font-size:13px}
.reasons li.y::before{content:"✓ ";color:var(--green);font-weight:700}
.reasons li.n::before{content:"✗ ";color:var(--red);font-weight:700}
.score{display:flex;align-items:center;gap:10px}
.score .bar{flex:1;height:8px;background:var(--line-2);border-radius:4px;overflow:hidden}
.score .bar i{display:block;height:100%}
.progress{height:10px;background:var(--line-2);border-radius:5px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--blue);transition:width .3s}
.stepper{display:flex;gap:0;flex-wrap:wrap;margin:8px 0 14px}
.stepper span{font-size:12px;padding:4px 10px;border:1px solid var(--line);margin-right:-1px;background:var(--panel);color:var(--ink-3)}
.stepper span.done{background:var(--green-bg);color:var(--green)}
.stepper span.cur{background:var(--blue);color:#fff;border-color:var(--blue)}
.stepper span.fail{background:var(--red);color:#fff;border-color:var(--red)}
.editor{display:grid;grid-template-columns:220px minmax(0,1fr) 340px;gap:12px;align-items:start}
.tree{font-family:var(--mono);font-size:12.5px}
.tree div{padding:3px 8px;border-radius:5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree div.on{background:var(--blue-bg);color:var(--blue)}
.tree div:hover{background:var(--line-2)}
.code{width:100%;min-height:520px;background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:12.5px;line-height:1.55;border-radius:8px;padding:12px;border:0;white-space:pre;tab-size:4;overflow:auto}
pre.codeview{background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:12.5px;padding:12px;border-radius:8px;overflow:auto;max-height:520px;margin:0;white-space:pre}
.tip{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:var(--panel)}
.tip b{display:block;font-family:var(--mono);font-size:12px;color:var(--purple);margin-bottom:4px}
.tip dl{margin:0;font-size:12.5px}.tip dt{font-weight:600;color:var(--ink-2);margin-top:4px}.tip dd{margin:0}
.diff{font-family:var(--mono);font-size:12px;white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;max-height:420px;overflow:auto}
.diff .a{background:var(--green-bg);color:var(--green);display:block}
.diff .d{background:var(--red-bg);color:var(--red);display:block;text-decoration:line-through}
.diff .c{display:block;color:var(--ink-3)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 14px;cursor:pointer;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--blue);font-weight:600}
.warnbox{border:1px solid var(--orange);background:var(--orange-bg);color:var(--ink);padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:13.5px}
.dangerbox{border:2px solid var(--red);background:var(--red-bg);color:var(--ink);padding:12px 14px;border-radius:8px;margin-bottom:12px;font-size:13.5px}
.infobox{border:1px solid var(--blue);background:var(--blue-bg);padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:13.5px}
.empty{text-align:center;padding:44px 20px;color:var(--ink-3)}
.empty h3{color:var(--ink)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:34px;text-align:center;cursor:pointer;background:var(--panel)}
.drop.over{border-color:var(--blue);background:var(--blue-bg)}
.modal-bg{position:fixed;inset:0;background:rgba(10,18,30,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--panel);border-radius:12px;max-width:560px;width:100%;padding:20px;max-height:90vh;overflow-y:auto;border:1px solid var(--line)}
.modal.wide{max-width:900px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.toast{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px}
.toast div{background:var(--ink);color:var(--panel);padding:10px 14px;border-radius:8px;font-size:13.5px;max-width:380px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast div.err{background:var(--red);color:#fff}
.login{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
.login .l{background:var(--side);color:#DCE6F2;padding:48px;display:flex;flex-direction:column;justify-content:center}
.login .l h1{font-size:30px;color:#fff;margin-bottom:12px}
.login .flow{margin-top:28px;display:flex;flex-direction:column;gap:0;max-width:360px}
.login .flow div{padding:9px 14px;border-left:3px solid #3A5A86;font-size:14px}
.login .flow div:nth-child(2){border-color:#EAA64A}.login .flow div:nth-child(3){border-color:#4CC08A}
.login .flow div:nth-child(4){border-color:#AE8AF0}.login .flow div:nth-child(5){border-color:#6B9CF0}
.login .r{display:flex;align-items:center;justify-content:center;padding:32px}
.login form{width:100%;max-width:360px}
.chart{display:flex;flex-direction:column;gap:8px}
.chart .row{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.chart .bar{height:14px;background:var(--line-2);border-radius:3px;overflow:hidden;display:flex}
.chart .bar i{display:block;height:100%}
.trace{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.trace .col{min-width:180px;flex:0 0 auto}
.trace .col h4{font-size:12px;color:var(--ink-3);margin:0 0 6px;font-weight:500}
.trace .node{border:1px solid var(--line);border-left:3px solid var(--c,var(--blue));border-radius:6px;padding:6px 8px;margin-bottom:6px;font-size:12.5px;background:var(--panel);cursor:pointer}
.trace .node:hover{border-color:var(--ink-3)}
.hide{display:none!important}
.row-flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.locked{color:var(--gray);font-size:12px}
.gwt{display:grid;grid-template-columns:70px 1fr;gap:4px 10px;font-size:13.5px}
.gwt b{color:var(--purple)}
.menu-btn{display:none}
@media (max-width: 1100px){.split3{grid-template-columns:1fr}.editor{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width: 820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 30% 0 0;z-index:40;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  .g2,.g3,.split2{grid-template-columns:1fr}
  .login{grid-template-columns:1fr}.login .l{padding:28px}
  .content{padding:16px 14px 60px}
  .kv{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="modal"></div>
<script>
"use strict";
/* ============ Utilities ============ */
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now().toString(36) + Math.random().toString(36).slice(2));
const now = () => new Date().toISOString();
const fmtDate = s => s ? new Date(s).toLocaleString("th-TH", { dateStyle: "short", timeStyle: "short" }) : "-";
const NF = "NOT_FOUND";
const pad = (n, l = 3) => String(n).padStart(l, "0");
const clone = o => JSON.parse(JSON.stringify(o));
async function sha256(buf) {
  const h = await crypto.subtle.digest("SHA-256", buf);
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join("");
}
const loadedScripts = {};
function loadScript(url) {
  if (loadedScripts[url]) return loadedScripts[url];
  loadedScripts[url] = new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = url; s.onload = res;
    s.onerror = () => { delete loadedScripts[url]; rej(new Error("โหลด Library ไม่สำเร็จ: " + url)); };
    document.head.appendChild(s);
  });
  return loadedScripts[url];
}
const LIB = {
  mammoth: "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js",
  xlsx: "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
  papa: "https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js",
  pdf: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",
  pdfWorker: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js",
  zip: "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js",
  bcrypt: "https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"
};
async function bcryptLib() { await loadScript(LIB.bcrypt); return window.dcodeIO.bcrypt; }
async function hashPassword(pw) { const b = await bcryptLib(); return new Promise((res, rej) => b.hash(pw, 10, (e, h) => e ? rej(e) : res(h))); }
async function verifyPassword(pw, h) { const b = await bcryptLib(); return new Promise((res, rej) => b.compare(pw, h, (e, ok) => e ? rej(e) : res(ok))); }

/* ============ Masking (Security §33) ============ */
function mask(text) {
  return String(text ?? "")
    .replace(/(password|passwd|pwd|รหัสผ่าน)\s*[:=]\s*\S+/gi, "$1=********")
    .replace(/(token|api[_-]?key|secret|otp|cookie|session)\s*[:=]\s*\S+/gi, "$1=********")
    .replace(/(Bearer\s+)[A-Za-z0-9._\-]+/g, "$1********")
    .replace(/sk-[A-Za-z0-9_\-]{8,}/g, "sk-********")
    .replace(/ghp_[A-Za-z0-9]{10,}/g, "ghp_********")
    .replace(/(mysql|postgres(?:ql)?|mongodb|jdbc:[a-z]+):\/\/[^\s"']+/gi, "$1://********")
    .replace(/\b\d{1}-?\d{4}-?\d{5}-?\d{2}-?\d{1}\b/g, m => "*".repeat(m.length - 4) + m.slice(-4))
    .replace(/\b(CUST|CIF|CUS)[-_]?\d{4,}\b/gi, m => m.slice(0, 4) + "****");
}

/* ============ Persistence (IndexedDB, local-first) ============ */
const DB_NAME = "brs-qa-platform", STORE = "kv";
let idb = null;
function openIdb() {
  return new Promise(res => {
    try {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(STORE);
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
    } catch { res(null); }
  });
}
async function idbGet(key) {
  if (!idb) return null;
  return new Promise(res => { try { const t = idb.transaction(STORE).objectStore(STORE).get(key); t.onsuccess = () => res(t.result ?? null); t.onerror = () => res(null); } catch { res(null); } });
}
async function idbSet(key, val) {
  if (!idb) { try { localStorage.setItem(DB_NAME + ":" + key, JSON.stringify(val)); } catch {} return; }

/* Build sections from blocks: [{type:'heading'|'para'|'table', text, rows, page}] */
function blocksToSections(blocks, docName) {
  const sections = []; let cur = null; let seq = 0;
  const open = (title, page) => { cur = { id: uid(), seq: ++seq, title: title || docName, page, pageEnd: page, kind: "text", text: "", original: "", status: "PENDING", attempts: 0, error: null, reqRefs: [] }; sections.push(cur); };
  for (const b of blocks) {
    if (b.type === "heading") { open(b.text.replace(/^#+\s*/, ""), b.page); continue; }
    if (b.type === "table") {
      const parent = cur ? cur.title : (b.caption && /^Worksheet/.test(b.caption) ? b.caption.replace(/^Worksheet:\s*/, "").replace(/\s*\(merged.*$/, "") : docName);
      sections.push({ id: uid(), seq: ++seq, title: (b.caption || ("ตาราง: " + parent)), parentTitle: parent, page: b.page, pageEnd: b.page, kind: "table", rows: b.rows, comments: b.comments || [], text: b.rows.map(r => r.join(" | ")).join("\n"), original: b.rows.map(r => r.join(" | ")).join("\n"), status: "PENDING", attempts: 0, error: null, reqRefs: [] });

/* Chunk: split big text sections at sentence/line boundaries with 1-line overlap; tables by rows (never mid-row) */

  for (const s of sections) {
    if (s.kind === "table" && s.rows.length > maxRows + 1) {
      const header = s.rows[0];
      for (let i = 1, part = 1; i < s.rows.length; i += maxRows, part++) {
        const rows = [header, ...s.rows.slice(i, i + maxRows)];
        out.push({ ...s, id: uid(), seq: ++seq, title: s.title + ` (ส่วน ${part})`, rows, text: rows.map(r => r.join(" | ")).join("\n"), original: rows.map(r => r.join(" | ")).join("\n"), rowOffset: i });

  [/(มากกว่า|เกินกว่า|สูงกว่า|greater than|more than|above|exceed(?:s|ing)?|>)/i, ">"],
  [/(น้อยกว่า|ต่ำกว่า|less than|below|<)/i, "<"],

function lineDiff(a, b) {
  const A = String(a || "").split("\n"), B = String(b || "").split("\n");
  if (A.length * B.length > 4e6) return [{ t: "c", s: "(ไฟล์ใหญ่เกินกว่าจะแสดง Diff)" }];
  const m = A.length, n = B.length, dp = Array.from({ length: m + 1 }, () => new Uint32Array(n + 1));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < m && j < n) { if (A[i] === B[j]) { out.push({ t: "c", s: A[i] }); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) out.push({ t: "d", s: A[i++] }); else out.push({ t: "a", s: B[j++] }); }
  while (i < m) out.push({ t: "d", s: A[i++] }); while (j < n) out.push({ t: "a", s: B[j++] });
  return out;
}
const renderDiff = (a, b, ctx = 2) => {
  const d = lineDiff(a, b); const keep = new Set();
  d.forEach((x, i) => { if (x.t !== "c") for (let k = i - ctx; k <= i + ctx; k++) keep.add(k); });
  if (!keep.size) return `<div class="diff"><span class="c">(ไม่มีความเปลี่ยนแปลง)</span></div>`;
  let last = -2; return `<div class="diff">${d.map((x, i) => { if (!keep.has(i)) return ""; const gap = i > last + 1 && last >= 0 ? `<span class="c">…</span>` : ""; last = i; return gap + `<span class="${x.t}">${x.t === "a" ? "+ " : x.t === "d" ? "- " : "  "}${esc(x.s)}</span>`; }).join("")}</div>`;
};

function runRuleEngine(artifact, onProgress, isCancelled) {
  return new Promise(resolve => {
    const tcs = artifact.tcRefs.map(id => S.testCases.find(t => t.id === id)).filter(Boolean);
    const results = []; const log = []; let i = 0; const started = Date.now();
    const limitMs = S.settings.runnerTimeoutSec * 1000, maxLog = S.settings.runnerMaxLogKb * 1024;
    log.push(`============================= test session starts =============================`);
    log.push(`runner: browser rule-engine | artifact: ${artifact.name} | timeout: ${S.settings.runnerTimeoutSec}s`);
    const step = () => {
      if (isCancelled()) { log.push("!!! CANCELLED by user"); return resolve({ status: "CANCELLED", results, stdout: log.join("\n"), stderr: "", exitCode: 130 }); }
      if (Date.now() - started > limitMs) { log.push("!!! RUNNER TIMEOUT"); return resolve({ status: "FAILED", results, stdout: log.join("\n"), stderr: "Runner Timeout", exitCode: 124 }); }
      if (i >= tcs.length) {
        const c = s => results.filter(x => x.status === s).length;
        log.push(`======= ${c("PASSED")} passed, ${c("FAILED")} failed, ${c("BLOCKED")} blocked in ${((Date.now() - started) / 1000).toFixed(2)}s =======`);
        let out = log.join("\n"); if (out.length > maxLog) out = out.slice(0, maxLog) + "\n[log truncated]";
        return resolve({ status: c("FAILED") ? "FAILED" : "PASSED", results, stdout: mask(out), stderr: "", exitCode: c("FAILED") ? 1 : 0 });
      }
      const tc = tcs[i++]; const { r, f, d } = tcCtx(tc);
      if (d.type === "Boundary" && r && f.thresholdOp !== NF) {
        d.testData.forEach(row => {
          let actual;
          if (row.raw === "" || row.raw === null) actual = "Validation Error";
          else if (isNaN(Number(String(row.raw).replace(/,/g, "")))) actual = "Invalid Data Type";
          else actual = meets(f.thresholdOp, Number(String(row.raw).replace(/,/g, "")), Number(f.thresholdValue)) ? "เข้าเงื่อนไข" : "ไม่เข้าเงื่อนไข";
          const ok = actual === row.expected;
          const name = `tests/unit/test_${slug(r.module)}.py::test_${slug(tc.tcId)}_boundary[${row.note}]`;
          results.push({ tcId: tc.tcId, tcRef: tc.id, name, status: ok ? "PASSED" : "FAILED", message: ok ? "" : `expected ${row.expected} but rule ${f.thresholdOp} ${f.thresholdValue} gives ${actual}`, duration: 0.001 });
          log.push(`${name} ${ok ? "PASSED" : "FAILED"}`); if (!ok) log.push(`E   AssertionError: ${results[results.length - 1].message}`);
        });
      } else {
        const name = `tests/unit/test_${slug(r ? r.module : "general")}.py::test_${slug(tc.tcId)}_${slug(d.type)}`;
        results.push({ tcId: tc.tcId, tcRef: tc.id, name, status: "BLOCKED", message: "NEEDS_CONFIGURATION: ต้องเชื่อมระบบจริง (API/UI/DB)", duration: 0 });
        log.push(`${name} SKIPPED (NEEDS_CONFIGURATION)`);
      }
      onProgress(Math.round(i / tcs.length * 100), log);
      setTimeout(step, 120);
    };
    step();
  });
}

function bindUpload(p) {
  const drop = $("#drop"), inp = $("#fileIn"); if (!drop) return;
  drop.onclick = () => inp.click(); drop.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); inp.click(); } };
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); }; drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); handleFiles(p, [...e.dataTransfer.files]); };
  inp.onchange = () => handleFiles(p, [...inp.files]);
}
async function handleFiles(p, files) {
  if (!guard("doc.upload")) return;
  const list = $("#upList"); const opts = { target: $("#upTarget").value, module: $("#upModule").value, mode: $("#upMode").value, auto: $("#upAuto").checked };
  list.innerHTML = `<div class="tblwrap"><table><thead><tr><th>ไฟล์</th><th>ขนาด</th><th>สถานะ</th><th>รายละเอียด</th></tr></thead><tbody id="upRows"></tbody></table></div>`;
  let lastDoc = null;
  for (const f of files) {
    const rowId = "r" + uid().slice(0, 6);
    $("#upRows").insertAdjacentHTML("beforeend", `<tr id="${rowId}"><td>${esc(safeFilename(f.name))}</td><td>${(f.size / 1048576).toFixed(2)} MB</td><td>${badge("RUNNING", "Uploaded")}</td><td class="small"></td></tr>`);
    const set = (st, txt, detail = "") => { const tr = $("#" + rowId); if (tr) { tr.children[2].innerHTML = badge(st, txt); tr.children[3].innerHTML = detail; } };
    try {
      const d = await ingestFile(p, f, opts, (st, txt) => set("RUNNING", txt));
      lastDoc = d; set("DONE", "Extracted", `${d.lastVersion.sections.length} Sections · ${d.lastVersion.images.length} รูป · SHA-256 ${d.lastVersion.checksum.slice(0, 12)}…${d.lastVersion.warnings.length ? "<br>" + d.lastVersion.warnings.map(esc).join(" · ") : ""} <a href="#/p/${p.id}/processing/${d.doc.id}?v=${d.lastVersion.v}">เปิด Processing</a>`);
    } catch (e) {
      const err = e.code ? e : appError("CORRUPT_FILE", "อ่านไฟล์ไม่สำเร็จ ไฟล์อาจเสียหาย", e.message || String(e), false, "ตรวจไฟล์แล้วอัปโหลดใหม่");
      set("FAILED", err.code, `${esc(err.userMessage)} — ${esc(err.suggestedAction)} <span class="muted">(Correlation ID ${err.correlationId})</span>`);
      audit("UPLOAD_FAILED", safeFilename(f.name), err.code + " " + err.technical);
    }
  }
  if (lastDoc && opts.auto) { go(`#/p/${p.id}/processing/${lastDoc.doc.id}?v=${lastDoc.lastVersion.v}`); startAnalysis(lastDoc.doc.id, lastDoc.lastVersion.v, opts.mode); }
}
async function ingestFile(p, file, opts, onStage) {
  const name = safeFilename(file.name), ext = extOf(name);
  if (!ALLOWED_EXT.includes(ext)) throw appError("UNSUPPORTED_FILE", `ไม่รองรับไฟล์ .${ext}`, name, false, "ใช้ DOCX, XLSX, CSV, PDF หรือ TXT");
  if (file.size > S.settings.maxFileMb * 1048576) throw appError("FILE_TOO_LARGE", `ไฟล์ใหญ่เกิน ${S.settings.maxFileMb} MB`, String(file.size), false, "แยกไฟล์หรือเพิ่ม Limit ใน Settings");
  if (!file.size) throw appError("CORRUPT_FILE", "ไฟล์ว่าง", name, false, "ตรวจไฟล์ต้นฉบับ");
  const buf = await file.arrayBuffer();
  if (!(await sniffType(buf, ext))) throw appError("UNSUPPORTED_FILE", "เนื้อหาไฟล์ไม่ตรงกับนามสกุล", ext, false, "ตรวจว่าไฟล์ไม่ได้ถูกเปลี่ยนนามสกุล");
  const checksum = await sha256(buf);
  return ingestBuffer(p, { name, ext, size: file.size, checksum, buf }, opts, onStage);
}
async function ingestBuffer(p, meta, opts, onStage = () => {}) {
  onStage("RUNNING", "Extracting");
  const parsed = await parseDocument(meta.buf, meta.ext);
  onStage("RUNNING", "Normalizing");
  onStage("RUNNING", "Creating Sections");
  const sections = blocksToSections(parsed.blocks, meta.name);
  if (!sections.length) throw appError("CORRUPT_FILE", "ไม่พบข้อความในเอกสาร", meta.name, false, "ตรวจว่าเป็นเอกสารที่มีข้อความ");
  const images = (parsed.images || []).slice(0, 80).filter(im => im.dataUri.length < 1.5e6);
  images.forEach(im => { const sec = sections.find(s => im.nearText && s.text.includes(im.nearText.slice(0, 60))) || sections[0]; im.sectionId = sec.id; im.sectionTitle = sec.title; });
  let doc = opts.target ? S.documents.find(d => d.id === opts.target) : null;
  if (doc && doc.versions.some(v => v.checksum === meta.checksum)) throw appError("DUPLICATE_DOCUMENT", "Version นี้มีอยู่แล้ว (Checksum ซ้ำ)", meta.checksum, false, "ไม่ต้องอัปโหลดซ้ำ");
  if (!doc) { doc = { id: uid(), projectId: p.id, name: meta.name, type: meta.ext, versions: [], created: now() }; S.documents.push(doc); }
  const v = { v: doc.versions.length + 1, fileName: meta.name, size: meta.size, checksum: meta.checksum, sections, images, warnings: parsed.warnings || [], pageCount: parsed.pageCount || null, created: now(), uploadedBy: me().username, module: opts.module, mode: opts.mode, job: { status: "EXTRACTED", stage: "Creating Sections", progress: 0, log: [`${now()} Uploaded ${meta.name} (${meta.checksum})`, `${now()} Extracted ${sections.length} sections, ${images.length} images`] } };
  doc.versions.push(v); p.updated = now();
  audit("UPLOAD", meta.name, `v${v.v} sha256=${meta.checksum}`);
  save();
  return { doc, lastVersion: v };
}

/* ============ Processing job controller (§6 Step 5, §31) ============ */
const jobCtl = {};
function findVersion(docId, vn) { const d = S.documents.find(x => x.id === docId); return d ? { d, v: d.versions.find(x => x.v === Number(vn)) || d.versions[d.versions.length - 1] } : {}; }
function jobLog(v, msg) { v.job.log.push(`${now()} ${mask(msg)}`); if (v.job.log.length > 2000) v.job.log.splice(0, 200); }
async function startAnalysis(docId, vn, mode, onlyIds) {
  if (!guard("doc.process")) return;
  const { d, v } = findVersion(docId, vn); if (!v) return;
  const key = d.id + ":" + v.v; if (jobCtl[key] && jobCtl[key].running) { toast("งานนี้กำลังทำงานอยู่"); return; }
  const p = S.projects.find(x => x.id === d.projectId);
  mode = mode || v.mode || "rule"; if (mode === "claude" && !capSample) { mode = "rule"; toast("Claude AI ไม่พร้อมใช้งานในมุมมองนี้ — ใช้ Rule Engine แทน"); }
  v.mode = mode; jobCtl[key] = { running: true, cancel: false };
  v.job.status = "RUNNING"; v.job.stage = "Analyzing Requirements"; jobLog(v, `Start analysis (mode=${mode}${onlyIds ? ", sections=" + onlyIds.length : ""})`);
  audit(onlyIds ? "PROCESS_RETRY" : "PROCESS", d.name, `v${v.v} mode=${mode}`); save(); render();
  const prev = d.versions.find(x => x.v === v.v - 1);
  const targets = v.sections.filter(s => onlyIds ? onlyIds.includes(s.id) : s.status !== "DONE");
  for (const sec of targets) {
    if (jobCtl[key].cancel) { v.job.status = "CANCELLED"; jobLog(v, "Cancelled by user"); break; }
    sec.status = "RUNNING"; sec.attempts++; sec.error = null; const t0 = Date.now(); rerenderProcessing();
    try {
      // remove previous non-approved requirements from this section (retry)
      const old = S.requirements.filter(r => r.source.sectionId === sec.id && r.docVersion === v.v);
      if (old.some(r => r.status === "APPROVED")) throw appError("SECTION_HAS_APPROVED", "Section นี้มี Requirement ที่ Approved แล้ว จึงไม่ประมวลผลซ้ำ", sec.id, false, "แก้ไข Requirement ผ่าน Requirement Explorer แทน");
      S.requirements = S.requirements.filter(r => !old.includes(r));
      const module = moduleFrom(sec.parentTitle || sec.title, v.module || "GENERAL");
      const ctx = { project: p, doc: d, version: v, section: sec, module };
      // carry over unchanged sections from previous version (version comparison)
      const same = prev && prev.sections.find(ps => ps.title === sec.title && ps.text === sec.text);
      if (same) {
        const carried = S.requirements.filter(r => r.docId === d.id && r.source.sectionId === same.id && r.isLatest !== false);
        carried.forEach(r => { r.source.sectionId = sec.id; r.docVersion = v.v; r.source.page = sec.page ?? r.source.page; });
        sec.reqRefs = carried.map(r => r.id); sec.carried = true;

      } else {

          const items = await aiExtractSection(ctx);
          created = items.map(it => buildRequirement(ctx, it.stmt, it.fields, it.meta));
        } else {
          created = candidateStatements(sec).map(st => buildRequirement(ctx, st));
        }
        const kept = [];
        if (prev) {
          const prevSec = prev.sections.find(ps => ps.title === sec.title);
          if (prevSec) {
            const olds = S.requirements.filter(r => r.docId === d.id && r.source.sectionId === prevSec.id && r.isLatest !== false);
            const norm = t => String(t).replace(/\s+/g, " ").trim();
            created = created.filter(c => { const o = olds.find(x => norm(x.originalText) === norm(c.originalText)); if (o) { o.source.sectionId = sec.id; o.docVersion = v.v; kept.push(o); return false; } return true; });
            const unmatched = olds.filter(o => !kept.includes(o));
            created.forEach(c => c.supersedes = unmatched.map(o => o.id));

        S.requirements.push(...created); sec.reqRefs = created.map(r => r.id).concat(kept.map(r => r.id));
        if (kept.length) jobLog(v, `Section ${sec.seq}: ${kept.length} requirements unchanged (carried over)`);
        jobLog(v, `Section ${sec.seq} "${sec.title}" → ${created.length} requirements (${Date.now() - t0} ms)`);
      }

    } catch (e) {
      const err = e.code && e.userMessage ? e : (e.code === "rate_limited" ? appError("AI_RATE_LIMIT", "AI ถูกจำกัดอัตราการเรียกใช้", e.message, true, "รอสักครู่แล้ว Retry Failed Only") : e.code === "not_granted" ? appError("AI_NOT_GRANTED", "ไม่ได้รับอนุญาตให้ใช้ Claude", e.message, true, "อนุญาตการใช้งาน หรือเปลี่ยนเป็น Rule Engine") : appError(e.code === "timeout" ? "AI_TIMEOUT" : "DOCUMENT_SECTION_FAILED", "วิเคราะห์ Section ไม่สำเร็จ", e.message || String(e), true, "กด Retry Section"));
      sec.status = "FAILED"; sec.error = err; sec.duration = Date.now() - t0;
      jobLog(v, `Section ${sec.seq} FAILED ${err.code}: ${err.technical}`);
    }
    v.job.progress = Math.round(v.sections.filter(s => s.status === "DONE").length / v.sections.length * 100);
    save(); rerenderProcessing();
  }
  if (v.job.status !== "CANCELLED") {
    v.job.stage = "Detecting Conflicts"; rerenderProcessing();
    const n = detectConflicts(p.id); jobLog(v, `Conflict detection: ${n} new conflicts`);
    S.requirements.filter(r => r.projectId === p.id && !["APPROVED", "DEPRECATED"].includes(r.status)).forEach(r => { const q = analyzeQuality(r); r.completeness = q.completeness; r.clarity = q.clarity; });

}

function sectionDiff(prev, cur) {
  const added = cur.sections.filter(s => !prev.sections.some(p => p.title === s.title));
  const removed = prev.sections.filter(s => !cur.sections.some(c => c.title === s.title));
  const changed = cur.sections.filter(s => { const p = prev.sections.find(x => x.title === s.title); return p && p.text !== s.text; }).map(s => ({ cur: s, prev: prev.sections.find(x => x.title === s.title) }));
  return { added, removed, changed };
}
function buildImpactProposals(d, prev, cur) {
  const { added, removed, changed } = sectionDiff(prev, cur);
  const exists = (type, ref) => S.impacts.some(i => i.docId === d.id && i.toV === cur.v && i.entityType === type && i.entityRef === ref);
  const push = (entityType, entityRef, label, proposal, reason) => { if (!exists(entityType, entityRef)) S.impacts.push({ id: uid(), projectId: d.projectId, docId: d.id, fromV: prev.v, toV: cur.v, entityType, entityRef, label, proposal, reason, status: "PROPOSED", created: now() }); };
  const reqsOf = sec => S.requirements.filter(r => r.docId === d.id && (r.source.sectionId === sec.id));
  const cascade = (r, proposal, why) => {
    push("Requirement", r.id, r.reqId, proposal, why);
    S.scenarios.filter(s => s.reqRef === r.id).forEach(s => push("Test Scenario", s.id, s.tsId, proposal === "Deprecation Candidate" ? "Deprecation Candidate" : "Review Required", `Requirement ${r.reqId} ${why}`));
    S.testCases.filter(t => t.reqRef === r.id && t.status !== "DEPRECATED").forEach(t => {
      push("Test Case", t.id, t.tcId, proposal === "Deprecation Candidate" ? "Deprecation Candidate" : (["APPROVED", "READY_FOR_AUTOMATION", "AUTOMATED"].includes(t.status) ? "Update Required" : "Review Required"), `Requirement ${r.reqId} ${why} — Retest แนะนำ`);
      S.artifacts.filter(a => a.tcRefs.includes(t.id)).forEach(a => push("Automation Script", a.id, `${a.kind}: ${a.name}`, "Review Required", `ใช้ Test Case ${t.tcId}`));
    });
  };
  const norm = t => String(t).replace(/\s+/g, " ").trim();
  changed.forEach(({ prev: ps, cur: cs }) => {
    S.requirements.filter(r => r.docId === d.id && (r.source.sectionId === ps.id || r.source.sectionId === cs.id) && !(r.supersedes || []).length && r.docVersion <= cur.v).forEach(r => {
      if (norm(cs.text).includes(norm(r.originalText))) push("Requirement", r.id, r.reqId, "No Impact", `ข้อความเดิมยังอยู่ใน Section "${cs.title}" v${cur.v}`);
      else cascade(r, "Update Required", `ข้อความใน Section "${ps.title}" ถูกแก้ไขใน v${cur.v}`);
    });
    S.requirements.filter(r => r.docId === d.id && r.source.sectionId === cs.id && (r.supersedes || []).length).forEach(r => push("Requirement", r.id, r.reqId, "New Test Required", `Requirement ใหม่จากการแก้ไข Section "${cs.title}" (แทน ${r.supersedes.map(id => (S.requirements.find(x => x.id === id) || {}).reqId).join(", ")})`));
  });
  removed.forEach(ps => reqsOf(ps).forEach(r => cascade(r, "Deprecation Candidate", `อยู่ใน Section "${ps.title}" ที่ถูกลบ`)));
  added.forEach(cs => push("Section", cs.id, cs.title, "New Test Required", "Section ใหม่ใน v" + cur.v));
  save();
}

  };

function generateArtifact(p, kind) {

  if (!tcs.length) { toast("เลือก Test Case ก่อน", true); return; }
  if (!draft && tcs.some(t => !ELIGIBLE.includes(t.status))) { toast("มี Test Case ที่ยังไม่ Approved — เปิดโหมด Generate Draft Code ถ้าต้องการ", true); return; }

  const a = { id: uid(), projectId: p.id, kind, name: `${p.code}-${kind}-${pad(nextSeq("ART-" + p.code + kind))}`, tcRefs: tcs.map(t => t.id), files: out.files, aiFiles: clone(out.files), tips: out.tips, draft, created: now(), createdBy: me().username, options: clone(o), secretWarnings: probs };

function suggestLocators(html) {
  const doc = new DOMParser().parseFromString(html, "text/html"); const out = []; const used = new Set();
  const nm = s => { let n = slug(s).slice(0, 30) || "element"; while (used.has(n)) n += "_2"; used.add(n); return n; };
  doc.querySelectorAll("input,button,a,select,textarea,[role],[data-testid],table").forEach(el => {
    const tid = el.getAttribute("data-testid"), aria = el.getAttribute("aria-label"), role = el.getAttribute("role") || ({ BUTTON: "button", A: "link", SELECT: "combobox", TEXTAREA: "textbox", TABLE: "table" }[el.tagName] || (el.tagName === "INPUT" ? (["checkbox", "radio"].includes(el.type) ? el.type : el.type === "submit" ? "button" : "textbox") : null));
    const id = el.id, lab = id ? doc.querySelector(`label[for="${CSS.escape(id)}"]`) : el.closest("label"); const labText = lab ? lab.textContent.trim() : "";
    const text = (el.textContent || el.value || "").trim().slice(0, 40);
    if (tid) out.push({ name: nm(tid), strategy: "get_by_test_id", value: tid, note: "1 data-testid (เสถียรที่สุด)" });
    else if (role && (aria || text) && ["button", "link", "checkbox", "radio", "tab", "table"].includes(role)) out.push({ name: nm((aria || text) + "_" + role), strategy: "get_by_role", value: `${role}|${aria || text}`, note: "2 role + accessible name" });
    else if (labText || aria) out.push({ name: nm((labText || aria) + "_input"), strategy: "get_by_label", value: labText || aria, note: "3 label" });
    else if (text && el.tagName !== "INPUT") out.push({ name: nm(text), strategy: "get_by_text", value: text, note: "4 text" });
    else if (id || el.getAttribute("name")) out.push({ name: nm(id || el.getAttribute("name")), strategy: "css", value: id ? `#${id}` : `${el.tagName.toLowerCase()}[name="${el.getAttribute("name")}"]`, note: "5 CSS — ควรขอให้ Dev เพิ่ม data-testid" });
    else { const idx = [...el.parentNode.children].filter(c => c.tagName === el.tagName).indexOf(el) + 1; out.push({ name: nm(el.tagName + "_" + idx), strategy: "xpath", value: `//${el.tagName.toLowerCase()}[${idx}]`, note: "6 XPath — ตัวเลือกสุดท้าย เปราะบาง" }); }
  });
  return out.slice(0, 60);
}

    $("#rsOk").onclick = async () => { const f = $("#rsF").files[0]; if (!f) return; try { const d = JSON.parse(await f.text()); if (d.schema !== 1 || !Array.isArray(d.users) || !d.users.length) throw new Error("ไม่ใช่ไฟล์ Backup ที่ถูกต้อง"); S = Object.assign(emptyState(), d); await idbSet("state", S); audit("BACKUP_RESTORE", f.name); closeModal(); logout("Restore แล้ว กรุณาเข้าสู่ระบบใหม่"); } catch (e) { toast("Restore ไม่สำเร็จ: " + e.message, true); } };
  },
  "reset-all": async () => { if (!guard("settings")) return; if (await confirmDialog("ลบข้อมูลทั้งหมด", "ข้อมูลทุก Project, Requirement, Test Case และผู้ใช้จะถูกลบถาวร ควร Export Backup ก่อน", "ลบทั้งหมด", true)) { S = emptyState(); await seedIfEmpty(); await idbSet("state", S); logout("ลบข้อมูลแล้ว เข้าสู่ระบบด้วย admin / Admin@12345"); } },
  "audit-csv": () => { const rows = [["at", "user", "action", "entity", "detail", "correlationId"], ...S.audit.map(a => [a.at, a.user, a.action, a.entity, a.detail, a.correlationId])]; downloadFile(`audit-log-${new Date().toISOString().slice(0, 10)}.csv`, "\uFEFF" + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n")); audit("EXPORT", "audit-log"); }
};
function currentPath(a) { const ed = $("#codeEd"); return ed ? ed.dataset.path : (ui.sel["file_" + a.id] || Object.keys(a.files)[0]); }
function stashEditor(explicit) {
  const ed = $("#codeEd"); if (!ed) return false; const a = S.artifacts.find(x => x.id === ed.dataset.art); if (!a || !can("auto.edit")) return false;
  const path = ed.dataset.path; if (a.files[path] === ed.value) return false;
  a.files[path] = ed.value; a.edited = true; audit("CODE_EDIT", a.name, path); save(); return true;
}
const CHANGE = {
  "switch-project": el => { if (el.value) go(`#/p/${el.value}/dashboard`); else go("#/projects"); },
  "f-toggle": el => { ui.f[el.dataset.k] = el.checked; render(); },
  f: el => { ui.f[el.dataset.k] = el.value; render(); },
  cmp: el => { const { q } = parseRoute(); const n = { doc: q.doc || "", from: q.from || "", to: q.to || "" }; n[el.dataset.k] = el.value; if (el.dataset.k === "doc") { n.from = ""; n.to = ""; } go(`#/p/${P().id}/compare?doc=${n.doc}&from=${n.from}&to=${n.to}`); },
  "tc-cell": el => { if (!guard("tc.edit")) return; const t = findTc(el.dataset.id); editTcData(t, { [el.dataset.k]: el.value }, "แก้ไขในตาราง"); },
  "draft-mode": async el => { if (el.checked && !(await confirmDialog("เปิดโหมด Generate Draft Code", "Code จะถูกสร้างจาก Test Case ที่ยังไม่ Approved และติดป้าย DRAFT ใช้เพื่อดูตัวอย่างเท่านั้น", "เปิดโหมด Draft"))) { el.checked = false; return; } ui.f["draft_" + el.dataset.k] = el.checked; if (el.checked) audit("DRAFT_CODE_MODE", el.dataset.k); render(); },
  "art-select": el => { ui.sel["art_" + el.dataset.k] = el.value; history.replaceState(null, "", `#/p/${P().id}/auto/${el.dataset.k}`); render(); },
  opt: el => { const o = ui.f["opt_" + el.dataset.k] = ui.f["opt_" + el.dataset.k] || {}; o[el.dataset.o] = el.type === "number" ? Number(el.value) : el.value; render(); },
  "opt-bool": el => { const o = ui.f["opt_" + el.dataset.k] = ui.f["opt_" + el.dataset.k] || {}; o[el.dataset.o] = el.checked; render(); },
  "opt-multi": el => { const o = ui.f["opt_" + el.dataset.k] = ui.f["opt_" + el.dataset.k] || {}; const s = new Set(o[el.dataset.o] || ["duplicate", "aggregation"]); el.checked ? s.add(el.dataset.v) : s.delete(el.dataset.v); o[el.dataset.o] = [...s]; },
  "user-role": el => { if (!guard("settings")) return; const u = S.users.find(x => x.id === el.dataset.id); audit("USER_ROLE_CHANGE", u.username, `${u.role} → ${el.value}`); u.role = el.value; save(); render(); },
  setting: el => { if (!guard("settings")) return; S.settings[el.dataset.k] = el.value.trim(); audit("SETTINGS_CHANGE", el.dataset.k); save(); render(); },
  "setting-bool": el => { if (!guard("settings")) return; S.settings[el.dataset.k] = el.checked; audit("SETTINGS_CHANGE", el.dataset.k, String(el.checked)); save(); render(); },
  "setting-num": el => { if (!guard("settings")) return; const n = Number(el.value); if (!isFinite(n) || n < Number(el.min || 0) || n > Number(el.max || 1e9)) { toast("ค่าอยู่นอกช่วงที่อนุญาต", true); render(); return; } S.settings[el.dataset.k] = n; audit("SETTINGS_CHANGE", el.dataset.k, String(n)); save(); },
  "setting-list": el => { if (!guard("settings")) return; S.settings[el.dataset.k] = el.value.split("\n").map(x => x.trim()).filter(x => /^https?:\/\//.test(x)); audit("SETTINGS_CHANGE", el.dataset.k); save(); render(); }
};
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === "A") ev.preventDefault();
  try { const r = fn(el, ev); if (r && r.catch) r.catch(e => toast(e.userMessage || e.message || String(e), true)); } catch (e) { console.error(e); toast(e.userMessage || e.message || String(e), true); }
});
document.addEventListener("change", ev => {
  const el = ev.target.closest("[data-change]"); if (!el) return;
  const fn = CHANGE[el.dataset.change]; if (fn) { try { fn(el, ev); } catch (e) { toast(e.message, true); } }
});
let inputTimer = null;
document.addEventListener("input", ev => {
  const el = ev.target; if (!el.dataset || el.dataset.input !== "f") return;
  ui.f[el.dataset.k] = el.value; clearTimeout(inputTimer);
  inputTimer = setTimeout(() => { const k = el.dataset.k, pos = el.selectionStart; render(); const n = document.querySelector(`[data-input="f"][data-k="${k}"]`); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch {} } }, 250);
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && $("#modal").innerHTML && !$("#np1")) closeModal(); });

/* ============ Demo project (synthetic data only, §45) ============ */
async function seedDemo() {
  let code = "CAM", i = 1; while (S.projects.some(p => p.code === code)) code = "CAM" + (++i);
  const p = { id: uid(), code, name: "Customer Activity Monitoring (Demo)", desc: "Demo Project — ข้อมูลสมมติทั้งหมด", modules: ["GENERAL", "RULE3", "RULE4"], members: [me().id], created: now() };
  S.projects.push(p); audit("PROJECT_CREATE", code, "demo");
  const buf = new TextEncoder().encode(DEMO_BRS).buffer;
  const r = await ingestBuffer(p, { name: "CAM-BRS-demo.txt", ext: "paste", size: buf.byteLength, checksum: await sha256(buf), buf }, { module: "GENERAL", mode: "rule" });
  save(); go(`#/p/${p.id}/processing/${r.doc.id}?v=1`);
  await startAnalysis(r.doc.id, 1, "rule");
  toast("สร้าง Demo Project แล้ว — ลองไปที่ Clarification & Conflict Center");
}

/* ============ Boot ============ */
(async function boot() {
  $("#root").innerHTML = `<div class="empty" style="padding-top:20vh">กำลังโหลด…</div>`;
  await loadState();
  try { await seedIfEmpty(); } catch (e) { $("#root").innerHTML = `<div class="dangerbox" style="margin:40px">โหลด Library สำหรับ Hash รหัสผ่านไม่สำเร็จ (${esc(e.message)}) — ตรวจการเชื่อมต่ออินเทอร์เน็ตแล้วรีเฟรช</div>`; return; }
  S.documents.forEach(d => d.versions.forEach(v => { if (v.job && v.job.status === "RUNNING") { v.job.status = "PAUSED"; v.sections.forEach(s => { if (s.status === "RUNNING") s.status = "PENDING"; }); } }));
  S.runs.forEach(r => { if (r.status === "RUNNING") { r.status = "CANCELLED"; r.summary = summarize(r.results); } });
  restoreSession();
  render();
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("sample").then(s => { capSample = s; if (s) render(); }).catch(() => {});
    window.claude.use("downloads").then(d => { capDownloads = d; }).catch(() => {});
  }
})();
</script>
